<script>
        // CAMBIO: Puerto 8884 para WebSockets seguros (WSS)
        const client = new Paho.MQTT.Client("d9c492e7fac740758650b31571bf4ed0.s1.eu.hivemq.cloud", 8884, "web_client_" + parseInt(Math.random()*1000));
        
        let ultimasLecturas = { ntc1: "--", ntc2: "--", baja1: "--", baja2: "--" };
        let ultimaAlerta = "Normal";
        let estadoFrio1 = "OFF", estadoFrio2 = "OFF", estadoCalor1 = "OFF", estadoCalor2 = "OFF";

        document.addEventListener("DOMContentLoaded", () => { renderizarHistorial(); });

        client.onMessageArrived = (message) => {
            const payload = message.payloadString;
            const topic = message.destinationName;

            if (topic === "rooftop/sensor/ntc1") {
                document.getElementById("ntc1").innerText = payload + " °C";
            } else if (topic === "rooftop/sensor/ntc2") {
                document.getElementById("ntc2").innerText = payload + " °C";
            } else if (topic === "rooftop/sensor/baja1") {
                document.getElementById("baja1").innerText = payload + " °C";
            } else if (topic === "rooftop/sensor/baja2") {
                document.getElementById("baja2").innerText = payload + " °C";
            } else if (topic === "rooftop/estado/confirmacion") {
                document.getElementById("txt_conf").innerText = payload;
            } else if (topic === "rooftop/estado/alerta") {
                document.getElementById("txt_alerta").innerText = payload;
                if(payload !== "Normal" && payload !== ultimaAlerta) {
                    registrarError(payload, `${document.getElementById("ntc1").innerText} / ${document.getElementById("ntc2").innerText}`);
                }
                ultimaAlerta = payload;
            } else if (topic === "rooftop/estado/presostatos1") {
                document.getElementById("pres1").innerText = payload;
            } else if (topic === "rooftop/estado/presostatos2") {
                document.getElementById("pres2").innerText = payload;
            } else if (topic === "rooftop/estado/ventilador") {
                actualizarBadge("ind-vent", payload);
                actualizarBotonEstado("btn-vent-on", "btn-vent-off", payload);
            } else if (topic === "rooftop/estado/frio1") {
                estadoFrio1 = payload;
                actualizarBadge("ind-f1", payload);
                actualizarBotonEstado("btn-f1-on", "btn-f1-off", payload);
                actualizarTextoEtapas();
            } else if (topic === "rooftop/estado/frio2") {
                estadoFrio2 = payload;
                actualizarBadge("ind-f2", payload);
                actualizarBotonEstado("btn-f2-on", "btn-f2-off", payload);
                actualizarTextoEtapas();
            } else if (topic === "rooftop/estado/calor1") {
                estadoCalor1 = payload;
                actualizarBadge("ind-c1", payload);
                actualizarBotonEstado("btn-c1-on", "btn-c1-off", payload);
                actualizarTextoEtapas();
            } else if (topic === "rooftop/estado/calor2") {
                estadoCalor2 = payload;
                actualizarBadge("ind-c2", payload);
                actualizarBotonEstado("btn-c2-on", "btn-c2-off", payload);
                actualizarTextoEtapas();
            }
        };

        // Conexión con SSL habilitado
        client.connect({
            useSSL: true,
            userName: "Hernan76",
            password: "Pearljam76",
            onSuccess: () => {
                console.log("Conectado a HiveMQ via WSS");
                client.subscribe("rooftop/sensor/#");
                client.subscribe("rooftop/estado/#");
            },
            onFailure: (err) => {
                console.error("Fallo de conexión MQTT: ", err);
                alert("Error al conectar con el servidor: " + err.errorMessage);
            }
        });

        function registrarError(evento, temps) {
            let historial = JSON.parse(localStorage.getItem("rooftop_errores") || "[]");
            historial.unshift({ fecha: new Date().toLocaleString(), evento: evento, temperaturas: temps });
            if (historial.length > 20) historial.pop();
            localStorage.setItem("rooftop_errores", JSON.stringify(historial));
            renderizarHistorial();
        }

        // --- FUNCIONES DE SOPORTE (Idénticas a tu original) ---
        function actualizarTextoEtapas() {
            let cFrio = (estadoFrio1 === "ON" ? 1:0) + (estadoFrio2 === "ON" ? 1:0);
            let cCalor = (estadoCalor1 === "ON" ? 1:0) + (estadoCalor2 === "ON" ? 1:0);
            let texto = (cFrio > 0) ? `Frío (${cFrio} Etapa${cFrio>1?'s':''})` : (cCalor > 0) ? `Calor (${cCalor} Etapa${cCalor>1?'s':''})` : "Apagado";
            document.getElementById("etapas").innerText = texto;
            document.getElementById("etapas-gen").innerText = texto;
        }

        function actualizarBadge(id, estado) {
            const el = document.getElementById(id);
            if(el) { el.innerText = (estado === "ON") ? "ENCENDIDO" : "APAGADO"; el.className = "badge " + (estado === "ON" ? "badge-on" : "badge-off"); }
        }

        function actualizarBotonEstado(onId, offId, estado) {
            const btnOn = document.getElementById(onId); const btnOff = document.getElementById(offId);
            if(btnOn && btnOff) { btnOn.className = (estado === "ON") ? "btn-activo" : ""; btnOff.className = (estado === "OFF") ? "btn-inactivo" : ""; }
        }

        function renderizarHistorial() {
            let h = JSON.parse(localStorage.getItem("rooftop_errores") || "[]");
            const cuerpo = document.getElementById("cuerpo-tabla-errores");
            cuerpo.innerHTML = h.length ? h.map(i => `<tr><td>${i.fecha}</td><td style="color:red;">${i.evento}</td><td>${i.temperaturas}</td></tr>`).join('') : `<tr><td colspan="3">Sin errores registrados.</td></tr>`;
        }

        function limpiarHistorial() { if(confirm("¿Borrar?")) { localStorage.removeItem("rooftop_errores"); renderizarHistorial(); } }
        function verificarClave() { if(document.getElementById("txt-pass").value === "1234") { document.getElementById("vista-monitoreo").classList.add("hidden"); document.getElementById("vista-tecnico").classList.remove("hidden"); } else alert("Clave incorrecta"); }
        function volverMonitoreo() { document.getElementById("vista-tecnico").classList.add("hidden"); document.getElementById("vista-monitoreo").classList.remove("hidden"); }
        function enviarComando(top, val) { message = new Paho.MQTT.Message(val); message.destinationName = top; client.send(message); }
    </script>
